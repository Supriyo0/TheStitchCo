<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="meshCenter" cx="80%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#0F172A" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="500" fill="url(#heroGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <rect width="1200" height="500" fill="url(#grid)"/>

  <!-- Glowing Lighting Spheres -->
  <circle cx="980" cy="220" r="260" fill="url(#meshCenter)"/>
  <circle cx="200" cy="100" r="160" fill="#2563EB" opacity="0.08"/>
  <circle cx="1050" cy="380" r="180" fill="#3B82F6" opacity="0.12"/>

  <!-- Right Geometric Aesthetic Silhouettes (Abstract Streetwear Apparel Layers) -->
  <g transform="translate(750, 40)" opacity="0.25">
    <!-- Abstract oversized Tee Contour Lines -->
    <path d="M 120 40 L 220 20 L 320 40 L 390 120 L 340 170 L 300 150 L 300 400 L 140 400 L 140 150 L 100 170 L 50 120 Z" 
          fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2" stroke-dasharray="6 6"/>
    <path d="M 170 30 Q 220 60 270 30" fill="none" stroke="#3B82F6" stroke-width="3"/>
  </g>

  <!-- High Tech Corner Accents -->
  <path d="M 40 40 L 40 70 M 40 40 L 70 40" stroke="#3B82F6" stroke-width="2" opacity="0.4"/>
  <path d="M 1160 40 L 1160 70 M 1160 40 L 1130 40" stroke="#3B82F6" stroke-width="2" opacity="0.4"/>
  <path d="M 40 460 L 40 430 M 40 460 L 70 460" stroke="#3B82F6" stroke-width="2" opacity="0.4"/>
  <path d="M 1160 460 L 1160 430 M 1160 460 L 1130 460" stroke="#3B82F6" stroke-width="2" opacity="0.4"/>
</svg>