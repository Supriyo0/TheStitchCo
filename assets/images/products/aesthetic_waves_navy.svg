<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_waves" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="480" fill="url(#grad_waves)" rx="16"/>
  
  <!-- Oversized T-Shirt Silhouette -->
  <path d="M110 80 L160 80 Q200 115 240 80 L290 80 L360 140 L320 195 L285 175 L285 425 L115 425 L115 175 L80 195 L40 140 Z" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  
  <!-- Kanagawa Style Retro Aesthetic Wave -->
  <circle cx="200" cy="210" r="70" fill="#38bdf8" opacity="0.15"/>
  <path d="M140 230 Q 170 160 200 230 Q 230 150 260 230 L 260 250 L 140 250 Z" fill="#38bdf8"/>
  <path d="M150 220 Q 180 170 200 220 Q 220 160 250 220" stroke="#ffffff" stroke-width="3" fill="none"/>
  <text x="200" y="280" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="3">AESTHETIC WAVES</text>
  <text x="200" y="300" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="3">OFFSHORE STREET DROP</text>

  <!-- Badge -->
  <rect x="20" y="20" width="110" height="26" rx="13" fill="#0284c7"/>
  <text x="75" y="37" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">240 GSM HEAVY</text>
  
  <!-- Footer Brand -->
  <text x="200" y="455" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">THE STITCH CO. • OVERSIZED FIT</text>
</svg>
