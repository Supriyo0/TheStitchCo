<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_zip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="480" fill="url(#grad_zip)" rx="16"/>
  
  <!-- Hoodie Silhouette with Full Zipper -->
  <path d="M160 50 Q200 40 240 50 Q260 90 230 110 Q200 120 170 110 Q140 90 160 50 Z" fill="#27272a" stroke="#3f3f46" stroke-width="2"/>
  <path d="M100 100 L150 100 Q200 125 250 100 L300 100 L370 180 L320 230 L290 200 L290 430 L110 430 L110 200 L80 230 L30 180 Z" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <!-- Silver Zipper Line -->
  <line x1="200" y1="120" x2="200" y2="430" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="4,2"/>
  
  <!-- Minimalist Embroidery -->
  <text x="155" y="190" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="14" font-weight="900" letter-spacing="2">TSC</text>
  <text x="200" y="270" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="18" font-weight="900" text-anchor="middle" letter-spacing="2">MIDNIGHT HEAVYWEIGHT</text>
  <text x="200" y="290" fill="#a1a1aa" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="3">FULL ZIP FLEECE HOODIE</text>

  <!-- Badge -->
  <rect x="20" y="20" width="105" height="26" rx="13" fill="#3f3f46"/>
  <text x="72" y="37" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">FULL ZIP DROP</text>
  
  <!-- Footer Brand -->
  <text x="200" y="455" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">THE STITCH CO. • 350 GSM</text>
</svg>
