      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="480" fill="url(#grad_grunge)" rx="16"/>
  
  <!-- Tee Outline -->
  <path d="M110 80 L160 80 Q200 115 240 80 L290 80 L360 140 L320 195 L285 175 L285 425 L115 425 L115 175 L80 195 L40 140 Z" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  
  <!-- Grunge Typography Graphic -->
  <circle cx="200" cy="205" r="60" fill="#e11d48" opacity="0.15"/>
  <polygon points="170,160 230,160 200,210" fill="#f43f5e"/>
  <text x="200" y="255" fill="#ffffff" font-family="'Impact', 'Outfit', sans-serif" font-size="22" font-weight="900" text-anchor="middle" letter-spacing="3">SMOKEY GRUNGE</text>
  <text x="200" y="275" fill="#fda4af" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="3">230 GSM BIO-WASHED HEAVY TEE</text>

  <!-- Badge -->
