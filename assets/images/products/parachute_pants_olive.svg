<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_para" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
  </defs>
  <rect width="400" height="480" fill="url(#grad_para)" rx="16"/>
  
  <!-- Parachute Baggy Pants Silhouette -->
  <path d="M135 70 L265 70 L290 420 L220 420 L200 210 L180 420 L110 420 Z" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
  <!-- Knee Darting Lines -->
  <path d="M130 240 Q150 250 170 240" stroke="#86efac" stroke-width="2" fill="none"/>
  <path d="M230 240 Q250 250 270 240" stroke="#86efac" stroke-width="2" fill="none"/>
  
  <!-- Ankle Bungee Toggles -->
  <circle cx="115" cy="420" r="5" fill="#f59e0b"/>
  <circle cx="285" cy="420" r="5" fill="#f59e0b"/>
  
  <!-- Branding -->
  <text x="200" y="160" fill="#86efac" font-family="'Outfit', sans-serif" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="3">RELAXED BAGGY DRAPE</text>
  <text x="200" y="360" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="18" font-weight="900" text-anchor="middle" letter-spacing="2">PARACHUTE STREET PANTS</text>
  <text x="200" y="380" fill="#bbf7d0" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="3">COTTON-NYLON WATER RESISTANT</text>

  <!-- Badge -->
  <rect x="20" y="20" width="100" height="26" rx="13" fill="#15803d"/>
  <text x="70" y="37" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">TRENDING</text>
  
  <!-- Footer Brand -->
  <text x="200" y="455" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">THE STITCH CO. • STREETWEAR BOTTOMS</text>
</svg>
