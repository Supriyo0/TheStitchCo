<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_hoodie1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="480" fill="url(#grad_hoodie1)" rx="16"/>
  
  <!-- Heavyweight Hoodie Silhouette with Hood and Kangaroo Pocket -->
  <path d="M160 50 Q200 40 240 50 Q260 90 230 110 Q200 120 170 110 Q140 90 160 50 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <path d="M100 100 L150 100 Q200 125 250 100 L300 100 L370 180 L320 230 L290 200 L290 430 L110 430 L110 200 L80 230 L30 180 Z" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <path d="M140 330 L260 330 L280 400 L120 400 Z" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  
  <!-- Cyber Phantom Logo -->
  <circle cx="200" cy="205" r="55" fill="#8b5cf6" opacity="0.15"/>
  <polygon points="175,175 200,150 225,175 220,210 180,210" fill="#a855f7"/>
  <circle cx="190" cy="185" r="4" fill="#ffffff"/>
  <circle cx="210" cy="185" r="4" fill="#ffffff"/>
  <text x="200" y="250" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="3">PHANTOM CYBER</text>
  <text x="200" y="270" fill="#c084fc" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="3">350 GSM FLEECE HOODIE</text>

  <!-- Badge -->
  <rect x="20" y="20" width="115" height="26" rx="13" fill="#7c3aed"/>
  <text x="77" y="37" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">350 GSM FLEECE</text>
  
  <!-- Footer Brand -->
  <text x="200" y="455" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">THE STITCH CO. • HEAVYWEIGHT HOODIE</text>
</svg>
