<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_cargo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="480" fill="url(#grad_cargo)" rx="16"/>
  
  <!-- Tactical Cargo Pants Silhouette -->
  <path d="M140 70 L260 70 L275 420 L215 420 L200 200 L185 420 L125 420 Z" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
  <!-- 6 Tactical Cargo Pockets -->
  <rect x="130" y="210" width="40" height="55" rx="4" fill="#27272a" stroke="#3f3f46" stroke-width="1.5"/>
  <rect x="230" y="210" width="40" height="55" rx="4" fill="#27272a" stroke="#3f3f46" stroke-width="1.5"/>
  <rect x="130" y="280" width="38" height="50" rx="4" fill="#27272a" stroke="#3f3f46" stroke-width="1.5"/>
  <rect x="232" y="280" width="38" height="50" rx="4" fill="#27272a" stroke="#3f3f46" stroke-width="1.5"/>
  
  <!-- Branding Tag -->
  <text x="200" y="160" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="3">6-POCKET TACTICAL</text>
  <text x="200" y="380" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="18" font-weight="900" text-anchor="middle" letter-spacing="2">STREET CARGO PANTS</text>
  <text x="200" y="400" fill="#a1a1aa" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="3">280 GSM HEAVYWEIGHT COTTON TWILL</text>

  <!-- Badge -->
  <rect x="20" y="20" width="110" height="26" rx="13" fill="#0284c7"/>
  <text x="75" y="37" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">BEST SELLER</text>
  
  <!-- Footer Brand -->
  <text x="200" y="455" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">THE STITCH CO. • 100% COTTON TWILL</text>
</svg>
