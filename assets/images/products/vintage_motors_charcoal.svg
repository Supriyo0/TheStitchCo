<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_motors" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
  </defs>
  <rect width="400" height="480" fill="url(#grad_motors)" rx="16"/>
  
  <!-- Silhouette -->
  <path d="M120 90 L160 90 Q200 120 240 90 L280 90 L340 140 L310 190 L280 170 L280 420 L120 420 L120 170 L90 190 L60 140 Z" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  
  <!-- Vintage Racing Graphic -->
  <circle cx="200" cy="205" r="65" fill="#f59e0b" opacity="0.15"/>
  <polygon points="170,160 230,160 245,210 155,210" fill="#f59e0b"/>
  <circle cx="175" cy="210" r="14" fill="#000000"/>
  <circle cx="225" cy="210" r="14" fill="#000000"/>
  <text x="200" y="260" fill="#ffffff" font-family="'Impact', 'Outfit', sans-serif" font-size="22" font-weight="900" text-anchor="middle" letter-spacing="2">VINTAGE MOTORS</text>
  <text x="200" y="280" fill="#f59e0b" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="3">SPEEDWAY RACING CO. 1994</text>

  <!-- Badge -->
  <rect x="20" y="20" width="100" height="26" rx="13" fill="#d97706"/>
  <text x="70" y="37" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">NEW DROP</text>
  
  <!-- Footer Brand -->
  <text x="200" y="455" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">THE STITCH CO. • 100% COMBED COTTON</text>
</svg>
