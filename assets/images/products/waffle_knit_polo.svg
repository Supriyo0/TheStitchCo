  <circle cx="200" cy="240" r="45" fill="#e4e4e7" opacity="0.08"/>
  <text x="200" y="275" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="18" font-weight="900" text-anchor="middle" letter-spacing="2">WAFFLE KNIT POLO</text>
  <text x="200" y="295" fill="#a1a1aa" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="3">240 GSM PIQUE TEXTURE</text>

