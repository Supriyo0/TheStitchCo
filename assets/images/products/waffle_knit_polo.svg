      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="480" fill="url(#grad_polo2)" rx="16"/>
  
  <!-- Polo Collar Outline -->
  <polygon points="170,80 200,120 230,80 215,75 185,75" fill="#3f3f46" stroke="#52525b" stroke-width="2"/>
  <path d="M115 85 L160 85 L200 115 L240 85 L285 85 L345 135 L315 185 L285 165 L285 420 L115 420 L115 165 L85 185 L55 135 Z" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <!-- Quarter Zip / Placket -->
  <line x1="200" y1="120" x2="200" y2="190" stroke="#a1a1aa" stroke-width="2.5"/>
  
